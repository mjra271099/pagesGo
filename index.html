<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Mengalihkan ke Video...</title>

  <link rel="preconnect" href="https://v-dey.com">
  <link rel="dns-prefetch" href="https://v-dey.com">

  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;min-height:100%}
    body{
      display:grid;place-items:center;min-height:100vh;padding:24px;
      background:#0a0a0a;color:#f5f5f5;
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    .box{width:100%;max-width:340px;text-align:center}
    .loader{
      width:44px;height:44px;margin:0 auto 22px;
      border:3px solid rgba(255,255,255,.1);border-top-color:#6ea8ff;
      border-radius:50%;animation:spin .7s linear infinite;
    }
    h1{margin:0 0 8px;font-size:17px;font-weight:600}
    p{margin:0;color:#999;font-size:13px;line-height:1.6}
    .btn{
      display:none;margin-top:24px;padding:13px 20px;border-radius:8px;
      background:#6ea8ff;color:#071426;font-size:14px;font-weight:650;
      text-decoration:none;
    }
    .btn:hover{background:#8bbaff}
    .btn:focus-visible{outline:2px solid #fff;outline-offset:4px}
    .err h1{color:#ff8585}
    .err .loader{display:none}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){.loader{animation:none}}
  </style>

  <noscript>
    <style>.loader{display:none}</style>
  </noscript>
</head>

<body>
  <main class="box" id="app" aria-live="polite">
    <div class="loader" aria-hidden="true"></div>
    <h1 id="t">Membuka video...</h1>
    <p id="d">Anda akan dialihkan secara otomatis.</p>
    <a class="btn" id="go" href="#" rel="noopener">Buka Video Sekarang &rarr;</a>
  </main>

  <script>
    (function () {
      var PLAYER = 'https://v-dey.com/player/player.html?id=';
      var app = document.getElementById('app'),
          t = document.getElementById('t'),
          d = document.getElementById('d'),
          go = document.getElementById('go');

      // Ambil ID sekali saja.
      var id = new URLSearchParams(location.search).get('id') ||
               location.pathname.split('/').filter(Boolean)[0] || '';
      try { id = decodeURIComponent(id); } catch (e) {}
      id = id.trim().replace(/\.mp4$/i, '');

      if (!/^[a-zA-Z0-9_-]{1,100}$/.test(id)) {
        app.className = 'box err';
        t.textContent = 'Video tidak ditemukan';
        d.textContent = 'Periksa kembali tautan video yang Anda buka.';
        return;
      }

      var target = PLAYER + encodeURIComponent(id);
      go.href = target;

      // Redirect tepat setelah tampilan pertama tergambar.
      var done = false;
      function redirect() {
        if (done) return;
        done = true;
        location.replace(target);
      }
      requestAnimationFrame(function () {
        requestAnimationFrame(redirect);
      });
      // Cadangan untuk tab yang berjalan di latar belakang (rAF dijeda).
      setTimeout(redirect, 300);

      // Tombol manual hanya muncul bila pengalihan lambat.
      var timer = setTimeout(function () {
        go.style.display = 'block';
        t.textContent = 'Pengalihan belum berhasil';
        d.textContent = 'Klik tombol di bawah untuk membuka video.';
      }, 1500);

      addEventListener('pagehide', function () { clearTimeout(timer); }, { once: true });
    })();
  </script>
</body>
</html>
