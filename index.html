<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Buka video...</title>
  <meta name="robots" content="noindex, nofollow">

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
      background: #0a0a0a;
      background-image:
        radial-gradient(circle at 50% 40%, rgba(90, 120, 255, 0.12), transparent 60%),
        radial-gradient(circle at 50% 100%, rgba(180, 90, 255, 0.08), transparent 55%);
      color: #eaeaea;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      animation: fadeIn 0.3s ease-out both;
    }

    .ring {
      position: relative;
      width: 72px;
      height: 72px;
    }

    .ring svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
      display: block;
    }

    .ring .track {
      fill: none;
      stroke: rgba(255, 255, 255, 0.08);
      stroke-width: 4;
    }

    .ring .bar {
      fill: none;
      stroke: #6ea8ff;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 201;
      stroke-dashoffset: 201;
      animation: fill 1.2s ease-out forwards;
    }

    .count {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 20px;
      font-weight: 600;
      color: #eaeaea;
    }

    .label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 14px;
      letter-spacing: 0.03em;
      color: rgba(234, 234, 234, 0.75);
    }

    .label .dots span { animation: blink 1.4s infinite both; }
    .label .dots span:nth-child(2) { animation-delay: 0.2s; }
    .label .dots span:nth-child(3) { animation-delay: 0.4s; }

    .error {
      text-align: center;
      padding: 20px 24px;
      border-radius: 14px;
      background: rgba(255, 90, 90, 0.08);
      border: 1px solid rgba(255, 90, 90, 0.2);
      color: #ff9c9c;
      font-size: 14px;
      line-height: 1.5;
      animation: fadeIn 0.3s ease-out both;
    }

    .error strong {
      display: block;
      font-size: 15px;
      margin-bottom: 6px;
      color: #ffb1b1;
    }

    .external-browser {
      margin-top: 8px;
      text-align: center;
      animation: fadeIn 0.3s ease-out both;
    }

    .external-browser a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 18px;
      border: 1px solid rgba(110, 168, 255, 0.35);
      border-radius: 10px;
      background: rgba(110, 168, 255, 0.08);
      color: #8db9ff;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s ease, border-color 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .external-browser a:hover {
      background: rgba(110, 168, 255, 0.16);
      border-color: rgba(110, 168, 255, 0.6);
    }

    .external-browser p {
      margin: 9px 0 0;
      color: rgba(234, 234, 234, 0.5);
      font-size: 11px;
      line-height: 1.5;
    }

    .copy-hint {
      display: none;
      margin-top: 6px;
      padding: 6px 10px;
      border-radius: 8px;
      background: rgba(110, 168, 255, 0.06);
      border: 1px dashed rgba(110, 168, 255, 0.25);
      color: rgba(234, 234, 234, 0.55);
      font-size: 10.5px;
      line-height: 1.5;
      word-break: break-all;
    }

    .copy-hint.visible { display: block; }

    @keyframes fill { to { stroke-dashoffset: 0; } }
    @keyframes blink {
      0%, 80%, 100% { opacity: 0.2; }
      40% { opacity: 1; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .label .dots span { animation: none; opacity: 0.8; }
    }
  </style>
</head>
<body>
  <div class="loader" id="loader">
    <div class="ring">
      <svg viewBox="0 0 72 72" aria-hidden="true">
        <circle class="track" cx="36" cy="36" r="32"></circle>
        <circle class="bar" cx="36" cy="36" r="32"></circle>
      </svg>
      <div class="count" id="count">▶</div>
    </div>

    <div class="label">
      Video siap dibuka
    </div>

    <div class="external-browser">
      <a href="#" id="openExternalBrowser">
        ↗ Open To Play
      </a>
      <p>Video tidak akan terbuka otomatis. Tekan tombol di atas.</p>
      <div class="copy-hint" id="copyHint"></div>
    </div>
  </div>

  <script>
    (function () {
      var id = null;

      // ---------- 1. Ambil ID ----------
      try {
        var params = new URLSearchParams(window.location.search);
        var queryId = params.get('id');
        if (queryId && queryId.trim() !== '') id = queryId.trim();
      } catch (e) { /* diabaikan */ }

      if (!id) {
        var path = window.location.pathname.replace(/^\/+|\/+$/g, '');
        if (path) id = path.split('/')[0];
      }

      if (!id) {
        document.body.innerHTML =
          '<div class="error"><strong>ID tidak ditemukan</strong>Pastikan URL berisi ID, contoh:<br>videil.com/?id=fa0zJuGW1</div>';
        return;
      }

      // ---------- 2. URL target ----------
      var targetUrl = 'https://v-dey.com/player/player.html?id=' + encodeURIComponent(id);

      // ---------- 3. Deteksi platform & in-app ----------
      var ua = navigator.userAgent || '';
      var isAndroid = /Android/i.test(ua);
      var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
                  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

      // Deteksi in-app browser (pola umum; cukup untuk memutuskan strategi)
      var isInApp = false;
      var inAppPatterns = /FBAN|FBAV|Instagram|Telegram|WhatsApp|Twitter|Line\/|MicroMessenger|Snapchat|TikTok|musical_ly|KakaoTalk|Naver|DaumApps|EverytimeApp|GoogleApp|GSA\//i;
      if (inAppPatterns.test(ua)) isInApp = true;

      // Telegram Android tidak punya sinyal UA yang jelas → cek objek global
      if (isAndroid && typeof window.TelegramWebview !== 'undefined') isInApp = true;

      // Tandai WebView generik (tapi jangan anggap in-app jika bukan Android/iOS)
      if (/wv\)/i.test(ua) && isAndroid) isInApp = true;

      // ---------- 4. Helper: clipboard + tampilkan URL manual ----------
      function showCopyHint() {
        var hint = document.getElementById('copyHint');
        if (!hint) return;
        hint.textContent = 'Salin tautan ini ke browser: ' + targetUrl;
        hint.classList.add('visible');

        // Coba salin otomatis (mungkin diblokir, jadi tetap tampilkan teks)
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(targetUrl).catch(function () {});
        }
      }

      // ---------- 5. Strategi escape per platform ----------
      function escapeAndroid() {
        // Coba Chrome dulu (package eksplisit)
        var intentChrome =
          'intent://' + targetUrl.replace(/^https?:\/\//i, '') +
          '#Intent;scheme=https;' +
          'action=android.intent.action.VIEW;' +
          'category=android.intent.category.BROWSABLE;' +
          'package=com.android.chrome;end';

        // Fallback: intent tanpa package → sistem pilih browser default
        var intentGeneric =
          'intent://' + targetUrl.replace(/^https?:\/\//i, '') +
          '#Intent;scheme=https;' +
          'action=android.intent.action.VIEW;' +
          'category=android.intent.category.BROWSABLE;end';

        // Coba Chrome via iframe tersembunyi untuk mengurangi risiko navigasi halaman
        try {
          var iframe = document.createElement('iframe');
          iframe.style.display = 'none';
          iframe.src = intentChrome;
          document.body.appendChild(iframe);
          setTimeout(function () {
            iframe.remove();
            // Jika Chrome gagal, coba intent generik
            window.location.href = intentGeneric;
          }, 600);
        } catch (e) {
          window.location.href = intentChrome;
          setTimeout(function () {
            window.location.href = intentGeneric;
          }, 600);
        }
      }

      function escapeIOS() {
        // iOS 17+: x-safari-https://
        var safariUrl = targetUrl.replace(/^https?:\/\//i, 'x-safari-https://');

        // Cadangan: Shortcuts x-callback-url (fallback ke browser default)
        var shortcutUrl =
          'shortcuts://x-callback-url/run-shortcut?name=' +
          encodeURIComponent('escape-' + Math.random().toString(36).slice(2)) +
          '&x-error=' + encodeURIComponent(targetUrl);

        // Karena iOS tidak selalu mengizinkan redirect otomatis dari WebView,
        // kita coba satu per satu dengan iframe + timeout.
        var tried = false;

        function trySafari() {
          if (tried) return;
          tried = true;
          window.location.href = safariUrl;
          setTimeout(function () {
            // Jika masih di sini, coba shortcut
            window.location.href = shortcutUrl;
            setTimeout(function () {
              // Terakhir: window.open / navigasi langsung
              var win = window.open(targetUrl, '_blank');
              if (!win) window.location.href = targetUrl;
            }, 700);
          }, 700);
        }

        trySafari();
      }

      function escapeFallback() {
        // Untuk desktop / browser normal / perangkat lain
        var win = window.open(targetUrl, '_blank');
        if (!win) {
          window.location.href = targetUrl;
        }
      }

      // ---------- 6. Pasang handler tombol ----------
      var externalButton = document.getElementById('openExternalBrowser');
      externalButton.href = targetUrl;
      externalButton.target = '_blank';
      externalButton.rel = 'noopener noreferrer';

      externalButton.addEventListener('click', function (e) {
        e.preventDefault();

        if (isAndroid) {
          escapeAndroid();
        } else if (isIOS) {
          escapeIOS();
        } else {
          escapeFallback();
        }

        // Selalu sediakan fallback manual setelah percobaan escape
        setTimeout(showCopyHint, 1800);
      });

      // Jika terdeteksi in-app dan tombol tidak ditekan,
      // tetap tampilkan hint kecil agar pengguna tahu harus menekan tombol.
      if (isInApp) {
        var hint = document.getElementById('copyHint');
        if (hint) {
          hint.textContent = 'Anda berada di browser dalam aplikasi. Tekan tombol di atas untuk membuka di browser.';
          hint.classList.add('visible');
        }
      }
    })();
  </script>
</body>
</html>
