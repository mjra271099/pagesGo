<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open video...</title>
  <meta name="robots" content="noindex, nofollow">

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body { margin: 0; height: 100%; overflow: hidden; }

    body {
      display: grid;
      place-items: center;
      background: #0a0a0a;
      background-image:
        radial-gradient(circle at 50% 40%, rgba(90, 120, 255, 0.12), transparent 60%),
        radial-gradient(circle at 50% 100%, rgba(180, 90, 255, 0.08), transparent 55%);
      color: #eaeaea;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      padding: 16px;
    }

    /* ---------- Language switch ---------- */
    .lang-switch {
      position: fixed; top: 12px; right: 12px;
      display: flex; gap: 3px; padding: 3px;
      border-radius: 10px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      z-index: 10;
      -webkit-tap-highlight-color: transparent;
    }
    .lang-switch button {
      background: transparent; border: none;
      color: rgba(234,234,234,0.45);
      font-size: 11px; font-weight: 700; letter-spacing: 0.04em;
      padding: 5px 9px; border-radius: 7px; cursor: pointer;
      font-family: inherit;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .lang-switch button.active {
      background: rgba(110,168,255,0.18);
      color: #8db9ff;
    }

    /* ---------- Loader ---------- */
    .loader {
      display: flex; flex-direction: column; align-items: center;
      gap: 20px; padding: 24px;
      max-width: 440px; text-align: center;
      animation: fadeIn 0.3s ease-out both;
    }

    .ring { position: relative; width: 72px; height: 72px; }
    .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
    .ring .track { fill: none; stroke: rgba(255,255,255,0.08); stroke-width: 4; }
    .ring .bar {
      fill: none; stroke: #6ea8ff; stroke-width: 4; stroke-linecap: round;
      stroke-dasharray: 201; stroke-dashoffset: 201;
      animation: fill 1.2s ease-out forwards;
    }
    .count {
      position: absolute; inset: 0;
      display: grid; place-items: center;
      font-size: 20px; font-weight: 600; color: #eaeaea;
    }
    .label {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 14px; letter-spacing: 0.03em;
      color: rgba(234,234,234,0.8);
    }

    /* ---------- Normal: Buka di Browser ---------- */
    .external-browser {
      margin-top: 4px; text-align: center; width: 100%;
      animation: fadeIn 0.3s ease-out both;
    }
    .external-browser a {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 22px;
      border: 1px solid rgba(110,168,255,0.45);
      border-radius: 11px;
      background: rgba(110,168,255,0.12);
      color: #a8c9ff;
      font-size: 14px; font-weight: 700;
      text-decoration: none; letter-spacing: 0.01em;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.1s ease;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 4px 18px -6px rgba(110,168,255,0.35);
      cursor: pointer;
    }
    .external-browser a:hover {
      background: rgba(110,168,255,0.2);
      border-color: rgba(110,168,255,0.7);
    }
    .external-browser a:active { transform: scale(0.98); }
    .external-browser p {
      margin: 11px 0 0;
      color: rgba(234,234,234,0.55);
      font-size: 12px; line-height: 1.55;
      max-width: 320px; margin-left: auto; margin-right: auto;
    }

    /* ---------- Petunjuk arah bawah (LEBIH TEGAS) ---------- */
    .arrow-down {
      margin: 10px auto 4px;
      width: 38px; height: 38px;
      color: #7eb3ff;
      animation: bounceDown 1.35s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      pointer-events: none;
      user-select: none;
      display: flex; align-items: center; justify-content: center;
      filter: drop-shadow(0 0 6px rgba(110,168,255,0.7))
              drop-shadow(0 0 14px rgba(110,168,255,0.35));
    }
    .arrow-down svg {
      width: 34px; height: 34px;
      display: block;
      stroke: currentColor;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .arrow-down svg polyline.top  { opacity: 0.4; }
    .arrow-down svg polyline.bot  { opacity: 1; }

    @keyframes bounceDown {
      0%   { transform: translateY(-3px); opacity: 0.65; }
      50%  { transform: translateY(7px);  opacity: 1; }
      100% { transform: translateY(-3px); opacity: 0.65; }
    }

    /* ---------- Manual mode (app-specific guide) ---------- */
    .manual-guide {
      display: none;
      width: 100%;
      animation: fadeIn 0.3s ease-out both;
    }
    .manual-guide.visible { display: block; }

    .guide-card {
      padding: 18px 18px 16px;
      border-radius: 14px;
      background: rgba(110,168,255,0.06);
      border: 1px solid rgba(110,168,255,0.25);
      text-align: left;
      max-width: 380px;
      margin: 0 auto;
    }
    .guide-title {
      margin: 0 0 8px;
      font-size: 14px; font-weight: 700; color: #a8c9ff;
      display: flex; align-items: center; gap: 8px;
      flex-wrap: wrap;
    }
    .guide-title::before {
      content: '⚠';
      display: inline-grid; place-items: center;
      width: 22px; height: 22px;
      border-radius: 50%;
      background: rgba(255,190,90,0.15);
      color: #ffce7a;
      font-size: 12px;
      flex-shrink: 0;
    }
    .guide-app {
      display: inline-block;
      padding: 1px 6px;
      margin: 0 2px;
      border-radius: 4px;
      background: rgba(110,168,255,0.18);
      color: #a8c9ff;
      font-weight: 600;
    }
    .guide-steps {
      margin: 0 0 14px;
      font-size: 12.5px; line-height: 1.65;
      color: rgba(234,234,234,0.78);
    }
    .guide-steps strong { color: #c5d9ff; }

    .copy-row {
      display: flex; gap: 8px;
      align-items: stretch;
      margin-top: 4px;
    }
    .copy-url {
      flex: 1; min-width: 0;
      padding: 9px 11px;
      border-radius: 8px;
      border: 1px solid rgba(110,168,255,0.2);
      background: rgba(0,0,0,0.35);
      color: rgba(234,234,234,0.7);
      font-size: 10.5px;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      -webkit-appearance: none;
    }
    .copy-url:focus { outline: none; border-color: rgba(110,168,255,0.5); }

    .copy-btn {
      flex-shrink: 0;
      padding: 9px 14px;
      border-radius: 8px;
      border: 1px solid rgba(110,168,255,0.4);
      background: rgba(110,168,255,0.15);
      color: #a8c9ff;
      font-size: 12px; font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }
    .copy-btn:hover {
      background: rgba(110,168,255,0.24);
      border-color: rgba(110,168,255,0.7);
    }
    .copy-btn.copied {
      background: rgba(120,200,140,0.18);
      border-color: rgba(120,200,140,0.5);
      color: #9be0ad;
    }

    .try-anyway {
      display: block;
      margin-top: 12px;
      text-align: center;
      font-size: 11px;
      color: rgba(234,234,234,0.35);
      text-decoration: underline;
      text-underline-offset: 3px;
      background: none; border: none; padding: 4px;
      cursor: pointer; font-family: inherit;
      -webkit-tap-highlight-color: transparent;
      width: 100%;
    }
    .try-anyway:hover { color: rgba(234,234,234,0.6); }

    /* ---------- Copy hint (fallback normal mode) ---------- */
    .copy-hint {
      display: none;
      margin: 10px auto 0;
      padding: 8px 11px;
      border-radius: 8px;
      background: rgba(110,168,255,0.07);
      border: 1px dashed rgba(110,168,255,0.28);
      color: rgba(234,234,234,0.6);
      font-size: 10.5px; line-height: 1.55;
      word-break: break-all;
      max-width: 340px;
    }
    .copy-hint.visible { display: block; }

    /* ---------- Error ---------- */
    .error {
      text-align: center;
      padding: 20px 24px; border-radius: 14px;
      background: rgba(255,90,90,0.08);
      border: 1px solid rgba(255,90,90,0.2);
      color: #ff9c9c; font-size: 14px; line-height: 1.5;
      animation: fadeIn 0.3s ease-out both;
      max-width: 340px;
    }
    .error strong {
      display: block; font-size: 15px; margin-bottom: 6px; color: #ffb1b1;
    }

    @keyframes fill { to { stroke-dashoffset: 0; } }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .external-browser a { transition: none; }
      .arrow-down {
        animation: none;
        opacity: 1;
        filter: drop-shadow(0 0 6px rgba(110,168,255,0.7));
      }
      .arrow-down svg polyline.top { opacity: 0.55; }
    }
  </style>
</head>
<body>
  <div class="lang-switch" id="langSwitch" aria-label="Language">
    <button type="button" data-lang="id">ID</button>
    <button type="button" data-lang="en">EN</button>
  </div>

  <div class="loader" id="loader">
    <div class="ring">
      <svg viewBox="0 0 72 72" aria-hidden="true">
        <circle class="track" cx="36" cy="36" r="32"></circle>
        <circle class="bar" cx="36" cy="36" r="32"></circle>
      </svg>
      <div class="count">▶</div>
    </div>

    <div class="label" id="labelText">Video ready to open</div>

    <!-- Mode normal: tombol Buka di Browser -->
    <div class="external-browser" id="externalBrowserBox">
      <a href="#" id="openExternalBrowser">↗ Open in Browser</a>
      <p id="hintText">Tap the button above to open the video in Chrome or your external browser. It will not open automatically.</p>

      <!-- Petunjuk arah bawah (double chevron, tegas) -->
      <div class="arrow-down" id="arrowDown" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <polyline class="top" points="6 6 12 12 18 6"></polyline>
          <polyline class="bot" points="6 13 12 19 18 13"></polyline>
        </svg>
      </div>

      <div class="copy-hint" id="copyHint"></div>
    </div>

    <!-- Mode manual: panduan khusus untuk app yang memblokir -->
    <div class="manual-guide" id="manualGuide">
      <div class="guide-card">
        <p class="guide-title" id="guideTitle">Open in External Browser</p>
        <p class="guide-steps" id="guideSteps"></p>

        <div class="copy-row">
          <input type="text" class="copy-url" id="copyUrl" readonly>
          <button type="button" class="copy-btn" id="copyBtn">Copy</button>
        </div>

        <button type="button" class="try-anyway" id="tryAnyway">Try anyway</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      /* ================= i18n ================= */
      var I18N = {
        id: {
          title: 'Buka video...',
          label: 'Video siap dibuka',
          btn: '↗ Buka di Browser',
          hint: 'Ketuk tombol di atas untuk membuka video di Chrome atau browser eksternal Anda. Video tidak terbuka otomatis.',
          copyFallback: 'Jika video tidak terbuka, salin tautan ini ke browser: ',
          guideTitle: 'Buka di Browser Eksternal',
          guideGeneric: 'Ketuk ikon menu (<strong>⋯</strong> atau <strong>⋮</strong>) di pojok aplikasi, lalu pilih <strong>Open in Browser</strong> / <strong>Buka di Browser</strong>.',
          copyBtn: 'Salin',
          copied: '✓ Tersalin',
          tryAnyway: 'Coba tetap buka',
          errTitle: 'ID tidak ditemukan',
          errBody: 'Pastikan URL berisi ID, contoh:<br>videil.com/?id=fa0zJuGW1',
          apps: {
            telegram: 'Ketuk ikon <strong>⋯</strong> di pojok kanan atas pesan, lalu pilih <strong>Open in Browser</strong> / <strong>Buka di Browser</strong>.',
            twitter: 'Ketuk ikon <strong>⋯</strong> di pojok kanan atas, lalu pilih <strong>Open in Browser</strong> / <strong>Open in Safari</strong>.',
            tiktok: 'Ketuk ikon <strong>⋯</strong> (share) di sisi kanan, lalu pilih <strong>Open in Browser</strong>.',
            whatsapp: 'Ketuk ikon <strong>⋯</strong> di pojok kanan atas, lalu pilih <strong>Open in Browser</strong> / <strong>Buka di Browser</strong>.',
            line: 'Ketuk ikon <strong>⋯</strong> di pojok kanan atas, lalu pilih <strong>Open in Browser</strong>.',
            wechat: 'Ketuk ikon <strong>⋯</strong> di pojok kanan atas, lalu pilih <strong>Open in Browser</strong>.',
            snapchat: 'Ketuk ikon <strong>⋯</strong> di pojok kanan atas, lalu pilih <strong>Open in Browser</strong>.',
            instagram: 'Ketuk ikon <strong>⋯</strong> di pojok kanan atas, lalu pilih <strong>Open in Browser</strong>.',
            facebook: 'Ketuk ikon <strong>⋯</strong> di pojok kanan atas, lalu pilih <strong>Open in Browser</strong>.',
            other: 'Ketuk ikon menu (<strong>⋯</strong> atau <strong>⋮</strong>) di aplikasi, lalu pilih <strong>Open in Browser</strong> / <strong>Buka di Browser</strong>.'
          }
        },
        en: {
          title: 'Open video...',
          label: 'Video ready to open',
          btn: '↗ Open in Browser',
          hint: 'Tap the button above to open the video in Chrome or your external browser. It will not open automatically.',
          copyFallback: 'If the video does not open, copy this link into your browser: ',
          guideTitle: 'Open in External Browser',
          guideGeneric: 'Tap the menu icon (<strong>⋯</strong> or <strong>⋮</strong>) at the corner of the app, then choose <strong>Open in Browser</strong>.',
          copyBtn: 'Copy',
          copied: '✓ Copied',
          tryAnyway: 'Try anyway',
          errTitle: 'ID not found',
          errBody: 'Make sure the URL contains an ID, e.g.:<br>videil.com/?id=fa0zJuGW1',
          apps: {
            telegram: 'Tap the <strong>⋯</strong> icon in the top right corner of the message, then choose <strong>Open in Browser</strong>.',
            twitter: 'Tap the <strong>⋯</strong> icon at the top right, then choose <strong>Open in Browser</strong> or <strong>Open in Safari</strong>.',
            tiktok: 'Tap the <strong>⋯</strong> (share) icon on the right side, then choose <strong>Open in Browser</strong>.',
            whatsapp: 'Tap the <strong>⋯</strong> icon at the top right, then choose <strong>Open in Browser</strong>.',
            line: 'Tap the <strong>⋯</strong> icon at the top right, then choose <strong>Open in Browser</strong>.',
            wechat: 'Tap the <strong>⋯</strong> icon at the top right, then choose <strong>Open in Browser</strong>.',
            snapchat: 'Tap the <strong>⋯</strong> icon at the top right, then choose <strong>Open in Browser</strong>.',
            instagram: 'Tap the <strong>⋯</strong> icon at the top right, then choose <strong>Open in Browser</strong>.',
            facebook: 'Tap the <strong>⋯</strong> icon at the top right, then choose <strong>Open in Browser</strong>.',
            other: 'Tap the menu icon (<strong>⋯</strong> or <strong>⋮</strong>) in the app, then choose <strong>Open in Browser</strong>.'
          }
        }
      };

      function detectLang() {
        var langs = navigator.languages && navigator.languages.length
          ? navigator.languages : [navigator.language || 'en'];
        for (var i = 0; i < langs.length; i++) {
          var code = (langs[i] || '').toLowerCase();
          if (code === 'id' || code.indexOf('id-') === 0 || code === 'in' || code.indexOf('in-') === 0) return 'id';
          if (code.indexOf('en') === 0) return 'en';
        }
        return 'en';
      }

      var LANG = detectLang();
      var T = I18N[LANG];

      /* ================= State ================= */
      var errorMode = false;
      var targetUrl = '';
      var manualMode = false;
      var detectedApp = 'other';
      var platform = 'other';
      var isInApp = false;
      var escapeScheme = 'open';

      /* ================= DOM ================= */
      var loaderEl = document.getElementById('loader');
      var labelEl = document.getElementById('labelText');
      var hintEl = document.getElementById('hintText');
      var buttonEl = document.getElementById('openExternalBrowser');
      var externalBox = document.getElementById('externalBrowserBox');
      var copyHintEl = document.getElementById('copyHint');
      var manualGuide = document.getElementById('manualGuide');
      var guideTitle = document.getElementById('guideTitle');
      var guideSteps = document.getElementById('guideSteps');
      var copyUrlEl = document.getElementById('copyUrl');
      var copyBtnEl = document.getElementById('copyBtn');
      var tryAnywayEl = document.getElementById('tryAnyway');
      var langSwitchEl = document.getElementById('langSwitch');

      /* ================= i18n helpers ================= */
      function updateLangSwitchUI() {
        var btns = langSwitchEl.querySelectorAll('button');
        for (var i = 0; i < btns.length; i++) {
          btns[i].classList.toggle('active', btns[i].getAttribute('data-lang') === LANG);
        }
      }

      function appName() {
        var map = { telegram: 'Telegram', twitter: 'X (Twitter)', tiktok: 'TikTok',
                    whatsapp: 'WhatsApp', line: 'LINE', wechat: 'WeChat',
                    snapchat: 'Snapchat', instagram: 'Instagram', facebook: 'Facebook',
                    other: 'In-App Browser' };
        return map[detectedApp] || 'In-App Browser';
      }

      function applyI18n() {
        document.documentElement.lang = LANG;
        document.title = T.title;

        if (errorMode) {
          loaderEl.innerHTML =
            '<div class="error"><strong>' + T.errTitle + '</strong>' + T.errBody + '</div>';
          updateLangSwitchUI();
          return;
        }

        labelEl.textContent = T.label;

        if (manualMode) {
          externalBox.style.display = 'none';
          manualGuide.classList.add('visible');
          guideTitle.innerHTML = T.guideTitle + ' — <span class="guide-app">' + appName() + '</span>';
          var steps = T.apps[detectedApp] || T.apps.other;
          guideSteps.innerHTML = steps;
          copyUrlEl.value = targetUrl;
          copyBtnEl.textContent = T.copyBtn;
          copyBtnEl.classList.remove('copied');
          tryAnywayEl.textContent = T.tryAnyway;
        } else {
          externalBox.style.display = '';
          manualGuide.classList.remove('visible');
          buttonEl.textContent = T.btn;
          hintEl.textContent = T.hint;

          copyHintEl.classList.remove('visible');
          copyHintEl.textContent = '';
        }

        updateLangSwitchUI();
      }

      function setLanguage(code) {
        LANG = (code === 'id') ? 'id' : 'en';
        T = I18N[LANG];
        applyI18n();
      }

      langSwitchEl.addEventListener('click', function (e) {
        var btn = e.target.closest('button[data-lang]');
        if (!btn) return;
        setLanguage(btn.getAttribute('data-lang'));
      });

      /* ================= Clipboard ================= */
      function copyToClipboard(text, onSuccess) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () {
            if (onSuccess) onSuccess();
          }).catch(function () { fallbackCopy(text, onSuccess); });
          return;
        }
        fallbackCopy(text, onSuccess);
      }

      function fallbackCopy(text, onSuccess) {
        try {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          ta.setSelectionRange(0, ta.value.length);
          var ok = document.execCommand('copy');
          ta.remove();
          if (ok && onSuccess) onSuccess();
        } catch (e) { /* diabaikan */ }
      }

      /* ================= Ambil ID ================= */
      var id = null;
      try {
        var params = new URLSearchParams(window.location.search);
        var queryId = params.get('id');
        if (queryId && queryId.trim() !== '') id = queryId.trim();
      } catch (e) { /* diabaikan */ }

      if (!id) {
        var path = window.location.pathname.replace(/^\/+|\/+$/g, '');
        if (path) id = path.split('/')[0];
      }

      if (!id) {
        errorMode = true;
        applyI18n();
        return;
      }

      /* ================= URL target ================= */
      targetUrl = 'https://v-dey.com/player/player.html?id=' + encodeURIComponent(id);

      /* ================= Deteksi ================= */
      var ua = navigator.userAgent || '';
      var isAndroid = /Android/i.test(ua);
      var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
                  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

      if (isAndroid) platform = 'android';
      else if (isIOS) platform = 'ios';

      if (/Telegram/i.test(ua) || (isAndroid && typeof window.TelegramWebview !== 'undefined')) {
        detectedApp = 'telegram';
      } else if (/Instagram/i.test(ua)) {
        detectedApp = 'instagram';
      } else if (/FBAN|FBAV/i.test(ua)) {
        detectedApp = 'facebook';
      } else if (/Twitter/i.test(ua)) {
        detectedApp = 'twitter';
      } else if (/TikTok|musical_ly|BytedanceWebview/i.test(ua)) {
        detectedApp = 'tiktok';
      } else if (/WhatsApp/i.test(ua)) {
        detectedApp = 'whatsapp';
      } else if (/Line\//i.test(ua)) {
        detectedApp = 'line';
      } else if (/MicroMessenger/i.test(ua)) {
        detectedApp = 'wechat';
      } else if (/Snapchat/i.test(ua)) {
        detectedApp = 'snapchat';
      } else if (/KakaoTalk|Naver|DaumApps|EverytimeApp|GoogleApp|GSA\//i.test(ua)) {
        detectedApp = 'other';
      } else if (/wv\)/i.test(ua) && isAndroid) {
        detectedApp = 'other';
      } else {
        detectedApp = 'browser';
      }

      isInApp = (detectedApp !== 'browser');

      /* ================= Strategi ================= */
      var HARD_BLOCK_IOS = ['twitter', 'tiktok', 'whatsapp', 'line', 'wechat', 'snapchat'];
      var HARD_BLOCK_ANY = ['telegram'];

      if (HARD_BLOCK_ANY.indexOf(detectedApp) !== -1) {
        manualMode = true;
      } else if (platform === 'ios' && HARD_BLOCK_IOS.indexOf(detectedApp) !== -1) {
        manualMode = true;
      } else if (detectedApp === 'wechat' || detectedApp === 'line' || detectedApp === 'snapchat') {
        manualMode = true;
      } else {
        manualMode = false;
      }

      if (isAndroid) {
        escapeScheme = 'intent';
      } else if (isIOS && detectedApp === 'instagram') {
        escapeScheme = 'instagram';
      } else if (isIOS) {
        escapeScheme = 'safari';
      } else {
        escapeScheme = 'open';
      }

      /* ================= Escape handlers ================= */
      function escapeInstagramIOS() {
        var encoded = encodeURIComponent(targetUrl);
        window.location.href = 'instagram://extbrowser/?url=' + encoded;
      }

      function escapeSafariIOS() {
        var safariUrl = targetUrl.replace(/^https?:\/\//i, 'x-safari-https://');
        window.location.href = safariUrl;
      }

      function escapeAndroid() {
        var scheme = targetUrl.replace(/^https?:\/\//i, '');
        var intentChrome =
          'intent://' + scheme +
          '#Intent;scheme=https;' +
          'action=android.intent.action.VIEW;' +
          'category=android.intent.category.BROWSABLE;' +
          'package=com.android.chrome;end';

        var intentGeneric =
          'intent://' + scheme +
          '#Intent;scheme=https;' +
          'action=android.intent.action.VIEW;' +
          'category=android.intent.category.BROWSABLE;end';

        try {
          var iframe = document.createElement('iframe');
          iframe.style.display = 'none';
          iframe.src = intentChrome;
          document.body.appendChild(iframe);
          setTimeout(function () {
            try { iframe.remove(); } catch (e) {}
            window.location.href = intentGeneric;
          }, 600);
        } catch (e) {
          window.location.href = intentChrome;
          setTimeout(function () { window.location.href = intentGeneric; }, 600);
        }
      }

      function escapeOpen() {
        var win = window.open(targetUrl, '_blank');
        if (!win) window.location.href = targetUrl;
      }

      function doEscape() {
        if (escapeScheme === 'instagram') escapeInstagramIOS();
        else if (escapeScheme === 'safari') escapeSafariIOS();
        else if (escapeScheme === 'intent') escapeAndroid();
        else escapeOpen();
      }

      /* ================= Handler tombol normal ================= */
      buttonEl.href = targetUrl;
      buttonEl.target = '_blank';
      buttonEl.rel = 'noopener noreferrer';

      buttonEl.addEventListener('click', function (e) {
        e.preventDefault();

        if (!isInApp) {
          escapeOpen();
          return;
        }

        doEscape();

        setTimeout(function () {
          copyHintEl.textContent = T.copyFallback + targetUrl;
          copyHintEl.classList.add('visible');
          copyToClipboard(targetUrl);
        }, 1800);
      });

      /* ================= Handler manual mode ================= */
      copyBtnEl.addEventListener('click', function () {
        copyToClipboard(targetUrl, function () {
          copyBtnEl.textContent = T.copied;
          copyBtnEl.classList.add('copied');
          setTimeout(function () {
            copyBtnEl.textContent = T.copyBtn;
            copyBtnEl.classList.remove('copied');
          }, 1600);
        });
      });

      tryAnywayEl.addEventListener('click', function () {
        doEscape();
      });

      /* ================= Render awal ================= */
      applyI18n();
    })();
  </script>
</body>
</html>
