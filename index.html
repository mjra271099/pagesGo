<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f0f;
      color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .loader {
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <p>Mengalihkan...</p>
  </div>

  <script>
    (function () {
      // Ambil path dari URL, contoh: /abc123 -> "abc123"
      var path = window.location.pathname.replace(/^\/+|\/+$/g, '');

      // Jika tidak ada ID, tampilkan pesan error
      if (!path) {
        document.body.innerHTML =
          '<div class="loader"><p>❌ ID tidak ditemukan di URL.</p></div>';
        return;
      }

      // Ambil hanya segmen pertama jika ada sub-path
      var id = path.split('/')[0];

      // Encode untuk keamanan
      var targetUrl =
        'https://v-dey.com/player/player.html?id=' + encodeURIComponent(id);

      // Redirect (gunakan replace agar tidak masuk history)
      window.location.replace(targetUrl);
    })();
  </script>
</body>
</html>
